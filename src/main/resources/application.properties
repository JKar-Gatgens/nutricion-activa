spring.application.name=nutricion-activa
server.port=80

# Contacto de WhatsApp (unica fuente del numero: lo consumen el boton flotante,
# el footer y el CTA del hero via WhatsappProperties)
app.whatsapp.numero=50689592110

# URL publica absoluta del sitio SIN barra final (para og:url / og:image).
# En Render definir la variable de entorno APP_SITIO_BASEURL con el dominio real.
app.sitio.base-url=${APP_SITIO_BASEURL:http://localhost}
# Mensaje con escapes unicode: los .properties se leen como ISO-8859-1,
# las tildes directas se corrompen (doble codificacion en el enlace wa.me)
app.whatsapp.mensaje=Hola Andr\u00e9s, vengo de la p\u00e1gina de Nutrici\u00f3n Activa y quiero informaci\u00f3n

# Base de datos: MySQL local en dev por defecto; en Render se sobreescribe con
# las variables de entorno APP_DB_* apuntando a Aiven. Ninguna credencial real
# vive en este archivo.
# connectionTimeZone=UTC es obligatorio: sin esto, el driver usa la zona
# horaria por defecto de la JVM (America/Costa_Rica en las maquinas de este
# equipo) para convertir Instant a las columnas DATETIME de `cita`,
# corrompiendo cada hora guardada por 6 horas (ver arquitectura-agendamiento.md,
# seccion 4).
spring.datasource.url=${APP_DB_URL:jdbc:mysql://localhost:3306/nutricion_activa?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC}
spring.datasource.username=${APP_DB_USERNAME:root}
spring.datasource.password=${APP_DB_PASSWORD:}

# Flyway es la unica fuente de verdad del esquema (docs/arquitectura-agendamiento.md,
# seccion 5): Hibernate solo valida que las entidades coincidan, nunca genera DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Correo saliente (HU-05, D-05): Gmail personal del PO con contrasena de
# aplicacion. Puerto 587 + STARTTLS (no 465/SSL directo) es lo recomendado por
# Google para contrasenas de aplicacion. Ninguna credencial real vive en este
# archivo; en Render se sobreescriben APP_MAIL_USERNAME/APP_MAIL_PASSWORD.
# Timeouts explicitos: sin ellos JavaMail espera indefinidamente si el SMTP se
# cuelga, lo que agotaria el pool de hilos de @Async (spring.task.execution.*)
# con correos colgados en vez de fallar rapido y loguear (ver
# NotificacionCitaListener).
spring.mail.host=${APP_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${APP_MAIL_PORT:587}
spring.mail.username=${APP_MAIL_USERNAME:}
spring.mail.password=${APP_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Remitente visible y destinatario del aviso al nutricionista. correo-nutricionista
# coincide hoy con el correo publicado en el footer (fragments/layout.html) --
# ver docs/pendientes.md, "Correo de marca en el footer": ambos se actualizan
# juntos cuando el PO confirme el correo de marca definitivo.
app.mail.remitente-nombre=${APP_MAIL_REMITENTE_NOMBRE:Nutrici\u00f3n Activa}
app.mail.correo-nutricionista=${APP_MAIL_NUTRICIONISTA:andresht0502@gmail.com}
