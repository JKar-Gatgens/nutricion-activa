spring.application.name=nutricion-activa
server.port=80

# Contacto de WhatsApp (unica fuente del numero: lo consumen el boton flotante,
# el footer y el CTA del hero via WhatsappProperties)
app.whatsapp.numero=50689592110

# URL publica absoluta del sitio SIN barra final (para og:url / og:image).
# En Render definir la variable de entorno APP_SITIO_BASEURL con el dominio real.
app.sitio.base-url=${APP_SITIO_BASEURL:http://localhost}
# Mensaje con escapes unicode: los .properties se leen como ISO-8859-1,
# las tildes directas se corrompen (doble codificacion en el enlace wa.me)
app.whatsapp.mensaje=Hola Andr\u00e9s, vengo de la p\u00e1gina de Nutrici\u00f3n Activa y quiero informaci\u00f3n
